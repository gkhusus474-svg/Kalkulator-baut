
name: Build APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ekstrak proyek Android
        run: |
          mkdir android-project
          unzip -q Kalkulator_Baut_BY_RIZKY_ABDILAH_CLOUD_BUILD.zip -d android-project
          ls -la android-project

      - name: Samakan target Java
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g; s/VERSION_8/VERSION_17/g' android-project/app/build.gradle
          cat android-project/app/build.gradle

      - name: Build APK
        run: gradle -p android-project assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-Baut-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          
